name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, types, tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests scripts --exclude scripts/audit
      - name: Ruff format
        run: ruff format --check src tests scripts --exclude scripts/audit
      - name: Mypy
        run: mypy
      - name: Pytest with coverage
        run: pytest --cov=ratescurve --cov-report=term --cov-fail-under=80
