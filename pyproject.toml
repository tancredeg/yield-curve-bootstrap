[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratescurve"
version = "1.0.0"
description = "Government yield curves (four interpolation schemes), bond risk, PCA and Euro-Bund futures basis on public data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tancrède Geli" }]
dependencies = [
    "numpy==2.3.4",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pandas-stubs==2.3.2.250926",
    "QuantLib==1.40",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "ipykernel==6.30.1",
]
fetch = ["openpyxl==3.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ratescurve"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
# historical Phase 0 scripts run against the audited commit, not this package
extend-exclude = ["scripts/audit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003", "B905", "RUF007"]

[tool.ruff.lint.per-file-ignores]
# report prose is assembled from long f-strings
"scripts/run_results.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/ratescurve"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true
